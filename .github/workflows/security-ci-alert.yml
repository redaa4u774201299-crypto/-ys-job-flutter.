name: Firestore Security CI Alert

on:
  workflow_run:
    workflows: [Flutter Web CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report-firestore-rules-failure:
    name: Report failed Firestore Rules gate
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create or update a security alert issue
        id: security_rules_failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100,
            });

            const verificationJob = data.jobs.find(
              (job) => job.name === 'Analyze, test, and build Flutter Web',
            );
            const rulesStep = verificationJob?.steps?.find(
              (step) => step.name === 'Run Firestore Security Rules tests',
            );

            if (rulesStep?.conclusion !== 'failure') {
              core.setOutput('security_rules_failed', 'false');
              core.info('The workflow failed outside the Firestore Rules gate; no security alert is created.');
              return;
            }

            core.setOutput('security_rules_failed', 'true');

            const label = 'security-ci';
            const title = '[Security CI] Firestore Rules test failed';
            const issueBody = [
              '## فشل بوابة أمان Firestore',
              '',
              'فشلت خطوة **Run Firestore Security Rules tests** داخل مسار CI. أوقف التحقيق أو النشر اليدوي للقواعد حتى تصحيح الاختبار أو القاعدة وتحقق التشغيل التالي بنجاح.',
              '',
              `- التشغيل: [#${run.run_number}](${run.html_url})`,
              `- الالتزام: \`${run.head_sha}\``,
              `- الفرع: \`${run.head_branch}\``,
              '',
              'لا تتضمن هذه التذكرة سجلات حساسة أو أسرارًا. راجع سجل Actions من الرابط أعلاه ثم أغلق التذكرة بعد نجاح إعادة التشغيل.',
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'D93F0B',
                description: 'Automated alert for a failed Firestore Rules CI gate',
              });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const existingIssue = openIssues.find((issue) => issue.title === title);

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `${issueBody}\n\n---\nتكرر الفشل في تشغيل أحدث؛ أُضيف هذا التعليق بدل إنشاء تذكرة مكررة.`,
              });
              core.notice(`Updated existing security alert issue #${existingIssue.number}.`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: issueBody,
              labels: [label],
            });
            core.notice(`Created security alert issue #${issue.number}.`);

      - name: Send optional Slack security notification
        if: steps.security_rules_failure.outputs.security_rules_failed == 'true' && secrets.SLACK_SECURITY_WEBHOOK_URL != ''
        env:
          SLACK_SECURITY_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          message="فشل اختبار قواعد Firestore في CI. التشغيل #${RUN_NUMBER}، الفرع ${HEAD_BRANCH}، الالتزام ${HEAD_SHA}. راجع: ${RUN_URL}"
          payload="$(jq -cn --arg text "$message" '{text: $text}')"
          curl --fail-with-body --silent --show-error --max-time 15 --retry 2 --retry-all-errors \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_SECURITY_WEBHOOK_URL"

      - name: Send optional Telegram security notification
        if: steps.security_rules_failure.outputs.security_rules_failed == 'true' && secrets.TELEGRAM_SECURITY_BOT_TOKEN != '' && secrets.TELEGRAM_SECURITY_CHAT_ID != ''
        env:
          TELEGRAM_SECURITY_BOT_TOKEN: ${{ secrets.TELEGRAM_SECURITY_BOT_TOKEN }}
          TELEGRAM_SECURITY_CHAT_ID: ${{ secrets.TELEGRAM_SECURITY_CHAT_ID }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          message="فشل اختبار قواعد Firestore في CI. التشغيل #${RUN_NUMBER}، الفرع ${HEAD_BRANCH}، الالتزام ${HEAD_SHA}. راجع: ${RUN_URL}"
          payload="$(jq -cn \
            --arg chat_id "$TELEGRAM_SECURITY_CHAT_ID" \
            --arg text "$message" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')"
          telegram_url="https://api.telegram.org/bot${TELEGRAM_SECURITY_BOT_TOKEN}/sendMessage"
          curl --fail-with-body --silent --show-error --max-time 15 --retry 2 --retry-all-errors \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$telegram_url"
